name: Deploy portal to GitHub Pages

on:
  push:
    # main 이 본선이다. 작업 브랜치는 PR로 main 에 병합한다.
    # 전환기 동안 기존 작업 브랜치 푸시도 계속 배포한다(끊김 방지).
    branches: ["main", "claude/infectious-disease-resources-org-kbjcfz"]
    paths: ["portal/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal
      - id: deployment
        uses: actions/deploy-pages@v4
